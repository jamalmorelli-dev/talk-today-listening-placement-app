name: Identity hotfix
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch identity handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Student ID / Code (Optional)</label>\n          <input type="text" id="studentCode" placeholder="e.g. TT-8842">','Student ID / Code * <span style="font-weight:400">(new student: 000)</span></label>\n          <input type="text" id="studentCode" required placeholder="e.g. 1693 or 000">')
          old="""    window.addEventListener('DOMContentLoaded', () => {
      const levelSelect = document.getElementById('initialLevel');
      currentLevel = levelSelect ? levelSelect.value : 'BEG';
      preloadLevelAudioBank(currentLevel);
    });"""
          new="""    window.addEventListener('DOMContentLoaded', () => {
      const q = new URLSearchParams(location.search);
      const set = (id, ...keys) => { for (const k of keys) { const v=q.get(k); if (v) { document.getElementById(id).value=v; break; } } };
      set('studentCode','studentId','studentCode','id');
      set('studentName','fullName','name');
      set('studentPhone','phone','whatsapp');
      const levelSelect = document.getElementById('initialLevel');
      const urlLevel=(q.get('level')||'').toUpperCase();
      if (levelSelect && ['SM','BEG','INT','ADV'].includes(urlLevel)) levelSelect.value=urlLevel;
      currentLevel = levelSelect ? levelSelect.value : 'BEG';
      preloadLevelAudioBank(currentLevel);
    });"""
          if old in s: s=s.replace(old,new)
          old2="""    function startAssessment(event) {
      if (event) event.preventDefault();"""
          new2="""    function startAssessment(event) {
      if (event) {
        const form=event.currentTarget;
        if (form && !form.checkValidity()) { form.reportValidity(); return; }
        event.preventDefault();
      }"""
          if old2 in s: s=s.replace(old2,new2)
          old3="""    function submitTest() {
      const durationSec = Math.round((new Date() - startTime) / 1000);"""
          new3="""    function submitTest() {
      const sid=document.getElementById('studentCode')?.value?.trim();
      const nm=document.getElementById('studentName')?.value?.trim();
      const ph=document.getElementById('studentPhone')?.value?.trim();
      if (!sid || !nm || !ph) { alert('Student ID, full name and phone are required.'); return; }
      const durationSec = Math.round((new Date() - startTime) / 1000);"""
          if old3 in s: s=s.replace(old3,new3)
          s=s.replace('Build ID: 2026-08-10-FINAL-02','Build ID: 2026-08-28-IDENTITY-HOTFIX-01')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "talk-today-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: permanently require and preserve student identity"
          git push
